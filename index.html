<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>おまつり じゃんけんマン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#c8102e;        /* 幟の朱 */
    --red-deep:#8c0a20;
    --vermilion:#e04a2f;  /* 鳥居の朱 */
    --navy:#1b2a4a;       /* 幟の紺 */
    --navy-deep:#101a30;
    --yellow:#e8b43a;
    --gold:#f3d98b;
    --orange:#d9713a;
    --dark:#1a1a1a;
    --cream:#fff8ec;
    --green:#2e7d6b;
    --blueacc:#2a4d80;
    --purple:#5c3a7e;
    --panel-gray:#e8e3d6;
    --panel-gray-dark:#c3bda9;
  }
  *{box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; touch-action:manipulation;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden;
    font-family:'DotGothic16','Zen Maru Gothic',sans-serif;
  }
  body{
    background:radial-gradient(circle at 50% 0%, #33456e, var(--navy-deep) 85%);
    color:var(--dark);
  }
  ::-webkit-scrollbar{ display:none; }

  .scanlines{
    position:fixed; inset:0; pointer-events:none; z-index:999;
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,.08) 0 1px, transparent 2px 4px);
    mix-blend-mode:multiply;
  }

  /* ===== 白い筐体 ===== */
  .cabinet{
    position:relative;
    width:100%; height:100dvh;
    display:flex; flex-direction:column;
    padding:min(1.6vw,10px);
    background:linear-gradient(160deg,#fffdf7 0%,#f4efe2 55%,#e2dbc8 100%);
    border-radius:20px;
    box-shadow: inset 0 0 0 3px var(--navy), inset 0 0 0 6px #fff, 0 0 40px rgba(0,0,0,.6);
    overflow:hidden;
  }
  /* 1・5：藍色の夜祭りの空 */
  .screen-panel{
    position:relative; flex:1; min-height:0;
    display:flex; flex-direction:column;
    border-radius:12px;
    background:
      radial-gradient(ellipse at 50% 108%, rgba(255,170,80,.30) 0%, transparent 46%),
      radial-gradient(ellipse at 16% 12%, rgba(120,160,220,.20) 0%, transparent 42%),
      linear-gradient(180deg, #0b1531 0%, #16244a 46%, #24325c 78%, #33406a 100%);
    border:3px solid #8f9496;
    box-shadow: inset 0 3px 14px rgba(0,0,0,.6);
    overflow:hidden;
  }
  /* 夜空の星 */
  .screen-panel::before{
    content:''; position:absolute; inset:0; z-index:0; pointer-events:none;
    background-image:
      radial-gradient(1.6px 1.6px at 12% 16%, rgba(255,255,255,.85), transparent),
      radial-gradient(1.4px 1.4px at 28% 8%, rgba(255,255,255,.6), transparent),
      radial-gradient(1.8px 1.8px at 44% 20%, rgba(255,255,255,.75), transparent),
      radial-gradient(1.3px 1.3px at 63% 10%, rgba(255,255,255,.55), transparent),
      radial-gradient(1.7px 1.7px at 78% 22%, rgba(255,255,255,.8), transparent),
      radial-gradient(1.4px 1.4px at 90% 12%, rgba(255,255,255,.6), transparent),
      radial-gradient(1.5px 1.5px at 35% 34%, rgba(255,255,255,.5), transparent),
      radial-gradient(1.5px 1.5px at 70% 38%, rgba(255,255,255,.45), transparent);
    animation:starTwinkle 4.5s ease-in-out infinite;
  }
  @keyframes starTwinkle{ 0%,100%{opacity:.75;} 50%{opacity:1;} }
  /* 地面（参道） */
  .screen-panel::after{
    content:''; position:absolute; left:0; right:0; bottom:0; height:16%; z-index:0;
    background:linear-gradient(180deg, rgba(40,30,20,.0), rgba(28,20,12,.55));
    pointer-events:none;
  }

  /* 背景の情景（SVGで描いた鳥居とお神輿。重ならないよう左右に配置） */
  .bg-scene{ position:absolute; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .bg-torii{
    position:absolute; left:1.5%; bottom:0;
    width:min(26vw,280px); opacity:.9;
    filter:drop-shadow(0 0 18px rgba(255,150,60,.35));
  }
  .bg-mikoshi{
    position:absolute; right:1.5%; bottom:1%;
    width:min(27vw,300px); opacity:.9;
    filter:drop-shadow(0 0 18px rgba(255,150,60,.3));
    transform-origin:50% 100%;
    animation:mikoshiSway 3.6s ease-in-out infinite;
  }
  @keyframes mikoshiSway{
    0%,100%{ transform:rotate(-2.4deg) translateY(0); }
    50%{ transform:rotate(2.4deg) translateY(-4px); }
  }
  .bg-torii svg, .bg-mikoshi svg{ width:100%; height:auto; display:block; }

  /* ===== 画面切り替え ===== */
  .screen{ display:none; position:absolute; inset:0; z-index:2; }
  .screen.active{ display:flex; }

  /* ===== トップ画面 ===== */
  #top{
    flex-direction:column; align-items:center; justify-content:center;
    padding:12px 16px; gap:min(2.2vh,16px);
  }
  /* 提灯を吊るす縄 */
  .lantern-rope{
    position:relative; width:100%;
    display:flex; justify-content:center;
    padding-top:12px;
  }
  .lantern-rope::before{
    content:''; position:absolute; left:-2%; right:-2%; top:6px; height:3px;
    background:linear-gradient(90deg, #6b5220 0%, #b08c46 50%, #6b5220 100%);
    border-radius:2px;
  }
  .lantern-row{
    display:flex; justify-content:center; align-items:flex-start;
    gap:min(2.4vw,22px); flex-wrap:nowrap;
  }
  .lantern{ position:relative; width:clamp(46px,8.4vw,96px); flex:0 0 auto; }
  .lantern::before{
    content:''; position:absolute; left:50%; top:-8px; width:3px; height:8px;
    background:#8a6a2a; transform:translateX(-50%);
  }
  /* 「例大祭」は色だけ変え、大きさは他と同じにそろえる */
  .lantern.sep .body{
    background:radial-gradient(circle at 35% 25%,#7d92bd,var(--navy) 70%,var(--navy-deep));
    border-color:var(--gold); color:#ffe9a8;
    text-shadow:0 0 4px rgba(0,0,0,.7), 0 1px 0 rgba(0,0,0,.5);
  }
  .lantern .body{
    width:100%; aspect-ratio:1/1.15; border-radius:50%;
    background:radial-gradient(circle at 35% 25%,var(--gold),var(--red) 70%,var(--red-deep));
    border:3px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(22px,4.2vw,46px); color:#3d1400; font-weight:700;
    text-shadow:0 0 3px rgba(255,240,200,.9), 0 1px 0 rgba(255,255,255,.55);
    box-shadow:0 0 12px rgba(243,217,139,.6), 0 3px 6px rgba(0,0,0,.3);
    position:relative; overflow:hidden;
  }
  /* F：提灯の内側でゆらめく灯り（文字より背面に置く） */
  .lantern .body{ isolation:isolate; }
  .lantern .body > *{ position:relative; z-index:2; }
  .lantern .body::before{
    content:''; position:absolute; left:50%; top:52%; z-index:0;
    width:150%; height:150%; transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(255,238,180,.42) 0%, rgba(255,200,90,.16) 40%, transparent 66%);
    animation:lanternFlame 2.6s ease-in-out infinite;
    pointer-events:none; mix-blend-mode:screen;
  }
  @keyframes lanternFlame{
    0%,100%{ opacity:.5; transform:translate(-50%,-50%) scale(1); }
    35%{ opacity:.72; transform:translate(-52%,-53%) scale(1.06); }
    70%{ opacity:.58; transform:translate(-48%,-51%) scale(.97); }
  }
  .lantern:nth-child(3n){ margin-top:9px; }

  .logo-block{ display:flex; align-items:center; justify-content:center; gap:2vw; }
  /* 2：紅白幕風の帯 */
  .maku{
    width:min(86%,760px); height:clamp(26px,4.4vh,44px);
    border-radius:4px; position:relative;
    background:repeating-linear-gradient(90deg,
      #fff 0 7.5%, var(--red) 7.5% 15%);
    border-top:4px solid var(--gold);
    box-shadow:0 4px 10px rgba(0,0,0,.45), inset 0 -6px 12px rgba(0,0,0,.18);
  }
  /* 幕の房飾り */
  .maku::after{
    content:''; position:absolute; left:0; right:0; bottom:-7px; height:7px;
    background:repeating-linear-gradient(90deg,
      var(--gold) 0 6px, transparent 6px 15px);
  }
  #top .subtitle{
    margin:0; font-size:clamp(18px,3.6vw,32px); font-weight:700; color:#2e1c00;
    text-shadow:0 1px 0 rgba(255,255,255,.6);
    background:var(--yellow); padding:6px 22px; border-radius:12px; border:3px solid #c98f00;
  }

  .menu{
    display:flex; gap:min(2vw,14px); width:100%; max-width:900px;
    justify-content:center; flex-wrap:wrap; margin-top:min(1.6vh,10px);
  }
  .menu-btn{
    flex:1 1 240px; max-width:340px; min-height:min(20vh,150px);
    font-family:inherit; cursor:pointer; border-radius:18px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    color:#fff; border:4px solid #fff;
    box-shadow:0 8px 0 rgba(0,0,0,.35);
    padding:10px;
  }
  .menu-btn:active{ transform:translateY(5px); box-shadow:0 3px 0 rgba(0,0,0,.35); }
  .menu-btn .icon{ font-size:clamp(26px,5.4vw,40px); }
  .menu-btn .label{ font-size:clamp(15px,3vw,22px); }
  .menu-btn .sub{ font-size:clamp(10px,1.9vw,13px); opacity:.9; }
  /* 3：メニューボタンを木札風に */
  .menu-btn{
    color:#4a2a0c;
    background:
      linear-gradient(180deg, rgba(255,255,255,.4) 0%, transparent 20%),
      repeating-linear-gradient(90deg, rgba(140,92,40,.08) 0 3px, rgba(255,255,255,0) 3px 9px),
      linear-gradient(165deg,#f7e3bd 0%,#e8caa0 45%,#d9b381 100%);
    border:5px solid #7a4a1c;
    box-shadow:0 8px 0 rgba(50,28,8,.5), inset 0 0 0 3px rgba(255,255,255,.4);
    text-shadow:0 1px 0 rgba(255,255,255,.5);
  }
  .menu-btn .label{ color:#4a2a0c; }
  .menu-btn .sub{ color:#6b4a24; opacity:1; }
  .menu-btn[data-go="study"] .label{ color:#1c5c4f; }
  .menu-btn[data-go="janken"] .label{ color:#a3101a; }

  .bgm-btn{
    position:absolute; top:8px; right:10px; z-index:20;
    font-family:inherit; cursor:pointer;
    font-size:clamp(10px,2vw,13px); padding:6px 12px;
    background:rgba(20,20,20,.72); color:#fff; border:2px solid #fff; border-radius:14px;
  }
  .bgm-btn.on{ background:var(--green); border-color:#fff; }
  .bgm-btn:active{ transform:translateY(1px); }


  /* ===== 各モード共通の「もどる」ボタン ===== */
  .back-btn{
    position:absolute; top:8px; left:10px; z-index:20;
    font-family:inherit; cursor:pointer;
    font-size:clamp(10px,2vw,13px); padding:6px 13px;
    background:rgba(20,20,20,.72); color:#fff; border:2px solid #fff; border-radius:14px;
  }
  .back-btn:active{ transform:translateY(1px); }

  /* ===== ① べんきょう ===== */
  #study{ flex-direction:column; align-items:center; justify-content:center; padding:40px 16px 14px; gap:10px; }
  .study-wrap{ width:100%; max-width:760px; display:flex; flex-direction:column; align-items:center; gap:10px; min-height:0; }
  .card{
    width:100%; flex:1; min-height:0; color:var(--dark); border-radius:18px;
    border:4px solid var(--gold); background:#fffdf6;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:16px; position:relative; overflow-y:auto;
    box-shadow:0 8px 20px rgba(0,0,0,.5), 0 0 24px rgba(255,180,90,.25);
  }
  .card .deco{ font-size:clamp(30px,6.4vw,52px); margin-bottom:8px; }
  .card p{
    font-family:'Zen Maru Gothic',sans-serif;
    font-size:clamp(18px,3.6vw,32px); line-height:1.7; margin:0; font-weight:700;
  }
  .card .pagenum{ position:absolute; top:8px; right:14px; font-size:13px; color:var(--red); }

  .timeline-title{ font-size:clamp(18px,3.4vw,28px); color:var(--red); margin:0 0 10px; font-weight:900; }
  .timeline-list{ display:flex; flex-direction:column; gap:7px; width:100%; }
  .tl-step{ display:flex; align-items:center; gap:10px; text-align:left; background:#f3f0e4; border-radius:12px; padding:6px 10px; }
  .tl-icon{
    flex:0 0 auto; width:clamp(34px,5.4vw,48px); height:clamp(34px,5.4vw,48px);
    border-radius:50%; background:var(--yellow); color:var(--dark);
    display:flex; align-items:center; justify-content:center; font-size:clamp(16px,2.8vw,24px);
    border:2px solid var(--red);
  }
  .tl-text .tl-label{ font-size:clamp(10px,1.8vw,13px); color:var(--red); }
  .tl-text .tl-body{ font-family:'Zen Maru Gothic'; font-weight:700; font-size:clamp(13px,2.4vw,19px); }

  .study-controls{ display:flex; gap:10px; width:100%; max-width:760px; }
  .btn{ font-family:inherit; border:none; cursor:pointer; color:#fff; border-radius:14px; box-shadow:0 5px 0 rgba(0,0,0,.3); }
  .btn:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.3); }
  .nav-btn{ flex:0 0 auto; font-size:clamp(17px,3.2vw,24px); padding:11px 18px; background:#4a4a48; border:2px solid #262624; }
  .speak-btn{ flex:1; font-size:clamp(15px,3vw,21px); padding:13px 10px; background:var(--green); border:2px solid #1a8074; }

  /* ===== ②③ じゃんけん（左右分割の横レイアウト） ===== */
  /* 上部＝じゃんけん本体、下部＝メッセージ1行 */
  .janken-screen{ flex-direction:column; padding:32px 12px 8px; gap:6px; }
  .janken-main{
    flex:1; min-height:0; width:100%;
    display:flex; flex-direction:row; align-items:center; justify-content:center; gap:2vw;
  }
  .janken-left{
    flex:1 1 auto; min-width:0; min-height:0;
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  /* 右は3つのボタンだけ */
  .janken-right{
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
  }

  /* 画面下のメッセージ帯（横1行） */
  .bottom-bar{
    flex:0 0 auto; width:100%;
    display:flex; align-items:center; gap:10px;
  }

  /* C：中央の丸から漏れる光（背景に奥行きを出す） */
  .wheel-wrap::before{
    content:''; position:absolute; left:50%; top:50%;
    width:190%; height:190%; transform:translate(-50%,-50%);
    border-radius:50%; pointer-events:none; z-index:0;
    background:radial-gradient(circle,
      rgba(255,190,120,.34) 0%,
      rgba(226,110,60,.18) 34%,
      rgba(200,16,46,.07) 55%,
      transparent 72%);
    animation:glowBreath 4.2s ease-in-out infinite;
  }
  @keyframes glowBreath{
    0%,100%{ opacity:.75; transform:translate(-50%,-50%) scale(1); }
    50%{ opacity:1; transform:translate(-50%,-50%) scale(1.06); }
  }

  /* A：金属リングの厚み（外周のベゼル） */
  .wheel-bezel{
    position:absolute; inset:-4.5%; border-radius:50%; z-index:4;
    pointer-events:none;
    background:conic-gradient(
      #6b6f76 0deg, #eef1f4 40deg, #9aa1a9 80deg, #5c6169 130deg,
      #dfe4e9 180deg, #878d95 225deg, #4e535a 275deg, #d6dbe0 320deg, #6b6f76 360deg
    );
    -webkit-mask:radial-gradient(circle, transparent 0 89%, #000 89.5% 100%);
    mask:radial-gradient(circle, transparent 0 89%, #000 89.5% 100%);
    box-shadow:
      0 8px 18px rgba(0,0,0,.45),
      inset 0 2px 3px rgba(255,255,255,.7),
      inset 0 -3px 5px rgba(0,0,0,.5);
  }
  /* ベゼル上部のハイライト */
  .wheel-bezel::after{
    content:''; position:absolute; inset:0; border-radius:50%;
    background:linear-gradient(180deg, rgba(255,255,255,.55) 0%, transparent 38%);
    transition:opacity .3s;
    -webkit-mask:radial-gradient(circle, transparent 0 89%, #000 89.5% 100%);
    mask:radial-gradient(circle, transparent 0 89%, #000 89.5% 100%);
  }

  .wheel-wrap{
    position:relative; display:flex; align-items:center; justify-content:center;
    width:min(72vh,60vw); height:min(72vh,60vw);
  }
  /* 7：ルーレット中、ふちの光が回る */
  .bezel-spin{
    position:absolute; inset:-4.5%; border-radius:50%; z-index:5;
    pointer-events:none; opacity:0; transition:opacity .3s;
    background:conic-gradient(
      transparent 0deg, rgba(255,255,255,.95) 24deg, rgba(255,220,140,.7) 44deg, transparent 74deg,
      transparent 180deg, rgba(255,255,255,.8) 204deg, rgba(255,220,140,.6) 224deg, transparent 254deg
    );
    -webkit-mask:radial-gradient(circle, transparent 0 89%, #000 89.5% 100%);
    mask:radial-gradient(circle, transparent 0 89%, #000 89.5% 100%);
    mix-blend-mode:screen;
  }
  .bezel-spin.on{ opacity:1; animation:bezelSpin .9s linear infinite; }
  @keyframes bezelSpin{ to{ transform:rotate(360deg); } }
  .wheel-ring{
    position:absolute; inset:0; border-radius:50%;
    background:conic-gradient(
      var(--red) 0deg 30deg, var(--cream) 30deg 60deg, var(--navy) 60deg 90deg,
      var(--red) 90deg 120deg, var(--cream) 120deg 150deg, var(--navy) 150deg 180deg,
      var(--red) 180deg 210deg, var(--cream) 210deg 240deg, var(--navy) 240deg 270deg,
      var(--red) 270deg 300deg, var(--cream) 300deg 330deg, var(--navy) 330deg 360deg
    );
    border:4px solid var(--gold);
    box-shadow:0 0 0 3px #fff, 0 0 26px 6px rgba(200,16,46,.45), 0 4px 10px rgba(0,0,0,.3);
    opacity:.95;
  }
  /* 放射状の光条（後光） */
  .wheel-rays{
    position:absolute; inset:-6%; border-radius:50%; z-index:1;
    background:repeating-conic-gradient(
      rgba(255,255,255,.34) 0deg 6deg, rgba(255,255,255,0) 6deg 18deg
    );
    mix-blend-mode:screen; opacity:.55;
    animation:raysSpin 26s linear infinite;
  }
  @keyframes raysSpin{ to{ transform:rotate(360deg); } }

  /* 抽選盤の外周に並ぶ電球 */
  .bulb-ring{ position:absolute; inset:0; z-index:2; pointer-events:none; }
  .bulb{
    position:absolute; left:50%; top:50%;
    width:clamp(7px,1.5vw,13px); height:clamp(7px,1.5vw,13px); border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fffbe8, #ffd25c 60%, #b57900);
    box-shadow:0 0 7px 2px rgba(255,214,92,.9), 0 1px 2px rgba(0,0,0,.5);
    animation:bulbChase 1.5s linear infinite;
  }
  @keyframes bulbChase{
    0%,72%,100%{ filter:brightness(.55); }
    82%{ filter:brightness(2.1); }
  }

  .big-hand-frame{ position:relative; z-index:3; width:84%; height:84%; }
  .player-hand{
    position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(circle at 50% 42%, #ff5b5b 0%, var(--red-deep) 55%, #3d0003 100%);
    border:4px solid #ffdede;
    display:flex; align-items:center; justify-content:center;
    font-size:min(32vh,26vw); line-height:1;
    box-shadow:0 0 30px 8px rgba(226,36,44,.8), inset 0 0 22px rgba(0,0,0,.6);
    filter:drop-shadow(0 0 6px #fff);
  }

  /* 待機中のアイドル演出 */
  .wheel-ring{ animation:wheelIdle 30s linear infinite; }
  @keyframes wheelIdle{ to{ transform:rotate(360deg); } }
  .lantern{ animation:lanternSway 3.4s ease-in-out infinite; transform-origin:top center; }
  .lantern:nth-child(2n){ animation-delay:.5s; }
  .lantern:nth-child(3n){ animation-delay:1.1s; }
  @keyframes lanternSway{
    0%,100%{ transform:rotate(-3.5deg); }
    50%{ transform:rotate(3.5deg); }
  }

  .dot-ring-dot{
    position:absolute; width:clamp(4px,1vw,8px); height:clamp(4px,1vw,8px);
    left:50%; top:50%; border-radius:50%;
    background:#fff; box-shadow:0 0 7px 2px #fff;
    animation:dotChase 1.2s linear infinite; opacity:.2;
  }
  @keyframes dotChase{ 0%,85%,100%{opacity:.15;} 92%{opacity:1;} }
  .land-flash{ animation:landFlashy .45s ease-out 1; }
  @keyframes landFlashy{
    0%{ filter:drop-shadow(0 0 30px #fff) brightness(2.4); transform:scale(1.14); }
    100%{ filter:drop-shadow(0 0 6px #fff) brightness(1); transform:scale(1); }
  }


  /* 丸の中央に重ねる「タップして」の案内 */
  .start-hint{
    position:absolute; z-index:8; bottom:14%;
    font-size:clamp(16px,2.8vw,30px); font-weight:700; color:rgba(255,255,255,.85);
    text-align:center; letter-spacing:.12em;
    text-shadow:0 2px 8px rgba(0,0,0,.8);
    animation:hintPulse 1.8s infinite;
    pointer-events:none;
  }
  @keyframes hintPulse{ 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.5; transform:scale(1.05);} }

  /* 結果は丸の中央に重ねて大表示 */

      linear-gradient(165deg, #f7e3bd 0%, #e8caa0 45%, #d9b381 100%);
    border:7px solid #7a4a1c;
    border-radius:10px;
    padding:min(1.8vh,16px) min(3.4vw,34px);
    font-size:min(9vh,8vw); font-weight:700; line-height:1;
    letter-spacing:.16em; white-space:nowrap;
    box-shadow:
      0 12px 0 rgba(60,32,10,.35),
      0 0 46px rgba(120,70,20,.5),
      inset 0 0 0 3px rgba(255,255,255,.45),
      inset 0 -6px 14px rgba(120,70,20,.28);
    text-shadow:0 2px 0 rgba(255,255,255,.6);
    transform:rotate(-4deg);
  }
  /* 木札の掛け紐 */
  .result-overlay::before{
    content:''; position:absolute; left:50%; top:-24px;
    width:36px; height:36px; margin-left:-18px;
    border:5px solid var(--red); border-bottom:none;
    border-radius:18px 18px 0 0;
  }
  .result-overlay.show{ display:block; animation:stampIn .34s cubic-bezier(.34,1.56,.64,1); }
  .result-overlay.win-stamp{ color:#a3141c; animation:stampBounce .6s cubic-bezier(.28,1.6,.5,1); }
  .result-overlay.lose-stamp{
    color:#1f3a63; transform:rotate(4deg);
    animation:stampPush .5s cubic-bezier(.2,1.4,.4,1);
  }
  .result-overlay.draw-stamp{ color:#7a5200; transform:rotate(0deg); }
  @keyframes stampIn{
    0%{ transform:rotate(-4deg) scale(.3); opacity:0; }
    100%{ transform:rotate(-4deg) scale(1); opacity:1; }
  }

<script>
/* ===== 音声読み上げ ===== */
let jaVoice = null;
function pickVoice(){
  const v = speechSynthesis.getVoices();
  jaVoice = v.find(x=>x.lang==='ja-JP') || v.find(x=>x.lang && x.lang.startsWith('ja')) || null;
}
if ('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, opt){
  if (!('speechSynthesis' in window)) return;
  if (window.bgm) bgm.duck(1600);
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang='ja-JP'; if (jaVoice) u.voice=jaVoice;
  u.rate = (opt && opt.rate) || 1.15;   /* すこし速く、弾んだ感じに */
  u.pitch = (opt && opt.pitch) || 1.9;  /* 高めの声で元気いっぱいに */
  u.volume = 1;
  speechSynthesis.speak(u);
}
/* 掛け声など、複数のことばを続けて元気よく言う */
function speakSeq(parts){
  if (!('speechSynthesis' in window)) return;
  if (window.bgm) bgm.duck(1800);
  speechSynthesis.cancel();
  parts.forEach(p=>{
    const u = new SpeechSynthesisUtterance(p.text);
    u.lang='ja-JP'; if (jaVoice) u.voice=jaVoice;
    u.rate = p.rate || 1.2;
    u.pitch = p.pitch || 2.0;
    u.volume = 1;
    speechSynthesis.speak(u);
  });
}

/* ===== 8bit効果音 ===== */
let actx=null;
function getCtx(){
  if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
  if(actx.state==='suspended') actx.resume();
  return actx;
}
/* 効果音はすべてこの出口を通す。音が重なっても潰れないよう自動で整える */
let sfxOut = null;
function getSfx(){
  const ctx = getCtx();
  if(!sfxOut){
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.setValueAtTime(-14, ctx.currentTime);
    comp.knee.setValueAtTime(22, ctx.currentTime);
    comp.ratio.setValueAtTime(9, ctx.currentTime);
    comp.attack.setValueAtTime(0.003, ctx.currentTime);
    comp.release.setValueAtTime(0.22, ctx.currentTime);
    sfxOut = ctx.createGain();
    sfxOut.gain.value = 0.9;
    sfxOut.connect(comp).connect(ctx.destination);
  }
  return sfxOut;
}
function beep(freq,start,dur,type='square',g=0.18){
  const ctx=getCtx(), osc=ctx.createOscillator(), gain=ctx.createGain();
  osc.type=type;
  osc.frequency.setValueAtTime(freq, ctx.currentTime+start);
  gain.gain.setValueAtTime(0, ctx.currentTime+start);
  gain.gain.linearRampToValueAtTime(g, ctx.currentTime+start+0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+start+dur);
  osc.connect(gain).connect(getSfx());
  osc.start(ctx.currentTime+start); osc.stop(ctx.currentTime+start+dur+0.02);
}
function playWin(){ [523,659,784,1047].forEach((f,i)=>beep(f,i*0.13,0.18,'square',0.2)); }
function playDraw(){ beep(500,0,0.12,'triangle',0.16); beep(500,0.16,0.12,'triangle',0.16); }
function playCelebrate(){
  [523,659,784,1047,1319].forEach((f,i)=>beep(f,i*0.09,0.2,'square',0.18));
  beep(2093,0.55,0.35,'sine',0.1);
}
function playPon(){ beep(1568,0,0.16,'square',0.25); beep(2093,0.02,0.22,'sine',0.15); }
/* 結果発表の「どどん！」（大太鼓を2回） */
/* 太鼓を1発鳴らす（vol は 0〜1 の目安） */
function taikoBeat(t, vol){
  const ctx=getCtx();
  /* 胴の響き */
  const osc=ctx.createOscillator(), gain=ctx.createGain();
  osc.type='sine';
  osc.frequency.setValueAtTime(240, ctx.currentTime+t);
  osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime+t+0.2);
  gain.gain.setValueAtTime(vol*0.42, ctx.currentTime+t);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+t+0.4);
  osc.connect(gain).connect(getSfx());
  osc.start(ctx.currentTime+t); osc.stop(ctx.currentTime+t+0.42);

  /* 中音域の胴鳴り（小型スピーカーで輪郭を出す） */
  const mid=ctx.createOscillator(), mg=ctx.createGain();
  mid.type='triangle';
  mid.frequency.setValueAtTime(430, ctx.currentTime+t);
  mid.frequency.exponentialRampToValueAtTime(190, ctx.currentTime+t+0.16);
  mg.gain.setValueAtTime(vol*0.20, ctx.currentTime+t);
  mg.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+t+0.26);
  mid.connect(mg).connect(getSfx());
  mid.start(ctx.currentTime+t); mid.stop(ctx.currentTime+t+0.28);

  /* 打面を叩いた当たり */
  const len=Math.floor(ctx.sampleRate*0.05);
  const buf=ctx.createBuffer(1,len,ctx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  const src=ctx.createBufferSource(); src.buffer=buf;
  const ng=ctx.createGain();
  ng.gain.setValueAtTime(vol*0.16, ctx.currentTime+t);
  ng.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+t+0.06);
  src.connect(ng).connect(getSfx());
  src.start(ctx.currentTime+t);
}

/* ===== お祭りBGM（祭囃子風の8bitループ・コード内で生成） ===== */
window.bgm = (function(){
  let on = true;           /* 初期はオン */
  let playing = false;     /* いま鳴らしているか */
  let timer = null;
  let step = 0;
  let master = null;
  const STEP_MS = 200;     /* 1ステップの長さ */

  /* 篠笛のかわりの8bitメロディ（和の陽音階・0は休み） */
  const melody = [
    784,  0, 880, 988, 1047, 0, 988, 880,
    784,  0, 659, 784,  880,  0, 784,   0,
    1047, 0, 988, 880,  784,  0, 659, 784,
    880,  0, 784, 659,  587,  0,   0,   0
  ];
  /* 太鼓のリズム（2=ドン、1=ドコ、0=休み） */
  const drum = [
    2,0,1,1, 2,0,1,0, 2,0,1,1, 2,1,0,1,
    2,0,1,1, 2,0,1,0, 2,0,1,1, 2,1,1,0
  ];

  function ensureMaster(){
    const ctx = getCtx();
    if(!master){
      master = ctx.createGain();
      master.gain.value = 0.22;
      master.connect(ctx.destination);
    }
    return ctx;
  }
  function note(freq, dur, type, g){
    const ctx = ensureMaster();
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(g, ctx.currentTime + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.connect(gain).connect(master);
    osc.start(); osc.stop(ctx.currentTime + dur + 0.02);
  }
  function taikoHit(strong){
    const ctx = ensureMaster();
    const f0 = strong ? 210 : 280;
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(f0, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(f0*0.45, ctx.currentTime + 0.13);
    gain.gain.setValueAtTime(strong ? 0.62 : 0.34, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
    osc.connect(gain).connect(master);
    osc.start(); osc.stop(ctx.currentTime + 0.22);
    /* 打面の当たりを足して、小型スピーカーでも輪郭を出す */
    const mid = ctx.createOscillator(), mg = ctx.createGain();
    mid.type = 'triangle';
    mid.frequency.setValueAtTime(strong ? 460 : 600, ctx.currentTime);
    mg.gain.setValueAtTime(strong ? 0.22 : 0.13, ctx.currentTime);
    mg.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
    mid.connect(mg).connect(master);
    mid.start(); mid.stop(ctx.currentTime + 0.1);
  }
  function tick(){
    const i = step % melody.length;
    const f = melody[i];
    if(f) note(f, 0.19, 'square', 0.14);
    /* 5度上を薄く重ねて、笛らしい厚みを出す */
    if(f && i % 4 === 0) note(f*1.5, 0.16, 'triangle', 0.05);
    const d = drum[i];
    if(d) taikoHit(d === 2);
    step++;
  }
  function startLoop(){
    if(playing) return;
    const ctx = ensureMaster();
    /* iOS対策：一時停止状態なら確実に再開してから鳴らす */
    if(ctx.state === 'suspended'){
      ctx.resume().then(()=>{
        if(!on || playing) return;
        playing = true;
        master.gain.setValueAtTime(0.22, ctx.currentTime);
        tick();
        timer = setInterval(tick, STEP_MS);
      });
      return;
    }
    playing = true;
    master.gain.setValueAtTime(0.22, ctx.currentTime);
    tick();
    timer = setInterval(tick, STEP_MS);
  }
  function stopLoop(){
    playing = false;
    clearInterval(timer);
    timer = null;
  }
  return {
    isOn: ()=> on,
    toggle(){
      on = !on;
      if(!on) stopLoop();
      return on;
    },
    /* じゃんけん画面に入ったとき／出たとき */
    enter(){ if(on) startLoop(); },
    leave(){ stopLoop(); },
    /* 掛け声や結果の音声が聞こえるよう、一時的に音量を下げる */
    duck(ms){
      if(!master) return;
      const ctx = getCtx();
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setValueAtTime(0.05, ctx.currentTime);
      master.gain.linearRampToValueAtTime(0.22, ctx.currentTime + (ms||1400)/1000);
    }
  };
})();

const HANDS=['rock','scissors','paper'];
const winMap={rock:'scissors',scissors:'paper',paper:'rock'};
function judge(mine,theirs){
  if(mine===theirs) return 'draw';
  return winMap[mine]===theirs ? 'win' : 'lose';
}

function createJankenController(opts){
  const stageEl=document.getElementById(opts.stageId);
  const screenEl=stageEl.closest('.screen');
  const els={
    playerHand:document.getElementById(opts.playerHandId),
    result:document.getElementById(opts.resultId),
    stepStart:document.getElementById(opts.stepStartId),
    choiceButtons:stageEl.querySelectorAll('.hand-buttons button'),
    careMsg:document.getElementById(opts.careMsgId),
    resetBtn:document.getElementById(opts.resetBtnId),
    bezelSpin:document.getElementById(opts.bezelSpinId),
    handPanel:stageEl.querySelector('.hand-buttons')
  };
  let phase='idle';
  let currentHand='rock';
  let handCycleTimer=null, trillTimer=null;

  function startHandCycle(){
    let i=0, elapsed=0;
    function delay(e){ return e<400?210 : e<800?120 : 60; }
    function tick(){
      currentHand=HANDS[i%3];
      setHand(els.playerHand, currentHand);
      i++;
      const d=delay(elapsed); elapsed+=d;
      handCycleTimer=setTimeout(tick,d);
    }
    tick();
  }

  function reset(){
    phase='idle'; currentHand='rock';
    clearTimeout(handCycleTimer); clearInterval(trillTimer);
    sparkleOff();
    if(els.bezelSpin) els.bezelSpin.classList.remove('on');
    els.handPanel.classList.remove('live');
    setHand(els.playerHand, null);
    els.playerHand.classList.remove('land-flash');
    els.choiceButtons.forEach(b=>b.classList.remove('picked','dimmed'));
    els.result.textContent='';
    els.result.classList.remove('show','win-stamp','lose-stamp','draw-stamp');
    els.careMsg.classList.remove('show');
    els.careMsg.textContent='';
    els.resetBtn.classList.remove('show');
    els.stepStart.style.display='block';
    speechSynthesis.cancel();
  }

  function startRound(){
    if(phase!=='idle') return;
    phase='running';
    bgm.enter();   /* タップ時に確実にBGMを起動させる */
    els.stepStart.style.display='none';
    els.careMsg.classList.remove('show');
    els.resetBtn.classList.remove('show');
    els.choiceButtons.forEach(b=>b.classList.remove('picked','dimmed'));
    els.result.textContent='';
    els.result.classList.remove('show','win-stamp','lose-stamp','draw-stamp');
    speakSeq([{text:'ジャン'},{text:'ケン！', rate:1.05, pitch:2.0}]);
    sparkleOn();
    bgm.duck(1200);
    if(els.bezelSpin) els.bezelSpin.classList.add('on');
    els.handPanel.classList.add('live');
    trillStep=0; trillTick(); trillTimer=setInterval(trillTick,75);
    startHandCycle();
  }

  function onPick(hand){
    if(phase!=='running') return;
    phase='result';
    clearTimeout(handCycleTimer); clearInterval(trillTimer);
    if(els.bezelSpin) els.bezelSpin.classList.remove('on');
    sparkleOff();

    const mine=currentHand;
    setHand(els.playerHand, mine);
    els.playerHand.classList.add('land-flash');
    els.choiceButtons.forEach(b=>{
      b.classList.add(b.dataset.hand===hand ? 'picked' : 'dimmed');
    });
    playPon();
    setTimeout(()=>els.playerHand.classList.remove('land-flash'),480);

    const result=judge(mine,hand);

    if(result==='draw'){
      /* あいこ：太鼓を軽く鳴らし、「あいこで」と言って次につなげる */
      els.result.textContent='あいこ';
      els.result.classList.add('show','draw-stamp');
      taikoBeat(0,0.8); taikoBeat(0.26,0.9);
      speak('あいこで', {rate:1.1, pitch:1.9});
      setTimeout(()=>{
        els.choiceButtons.forEach(b=>b.classList.remove('picked','dimmed'));
        els.result.classList.remove('show','draw-stamp');
        phase='idle';
        startRound();
      },1900);
      return;
    }

    /* 判定は「あそびに きた こ」から見た結果 */
    if(result==='lose'){
      /* 相手の子の勝ち：金色フラッシュ＋光の輪＋盛大な紙吹雪 */
      els.result.textContent='かち';
      els.result.classList.add('show','win-stamp');
      screenFlash('win');
      haloBurst(opts.haloId);
      confettiBurst();
    } else {
      /* 相手の子が負けでも、応援シンボルが舞い上がる華やかな演出にする */
      els.result.textContent='まけ';
      els.result.classList.add('show','lose-stamp');
      screenFlash('lose');
      riseBurst();
    }
    /* かち・まけは祭り太鼓の連打。BGMを一時的に下げて太鼓を前に出す */
    bgm.duck(2600);
    playDodon();
    /* 太鼓が鳴り終わってから「かち！」「まけ！」と読み上げる */
    setTimeout(()=>{
      speak(result==='lose' ? 'かち！' : 'まけ！', {rate:1.05, pitch:2.0});
    }, 1150);

    setTimeout(()=>{
      const msg=opts.messages[Math.floor(Math.random()*opts.messages.length)];
      els.careMsg.textContent=msg;
      els.careMsg.classList.add('show');
      speak(msg, {rate:1.05, pitch:1.8});
      els.resetBtn.classList.add('show');
    },2600);
  }

  screenEl.addEventListener('click',(e)=>{
    if(phase!=='idle') return;
    if(e.target.closest('.back-btn') || e.target.closest('.bgm-btn') || e.target.closest('.hand-buttons') || e.target.closest('.reset-btn')) return;
    startRound();
  });
  els.choiceButtons.forEach(b=>{
    b.addEventListener('click',(e)=>{ e.stopPropagation(); onPick(b.dataset.hand); });
  });
  els.resetBtn.addEventListener('click',(e)=>{ e.stopPropagation(); reset(); });

  reset();
  return { reset };
}

const ctrlJanken = createJankenController({
  stageId:'jankenStage',
  playerHandId:'h_playerHand', resultId:'h_result',
  stepStartId:'h_stepStart', haloId:'h_halo', bezelSpinId:'h_bezelSpin',
  careMsgId:'h_careMsg', resetBtnId:'h_resetBtn',
  messages:jankenMessages
});
window.resetControllers = function(){ ctrlJanken.reset(); };

/* iOS Safari: 最初のタップで音を有効化 */
/* iOS Safari対策：画面に触れた瞬間に、必ず音の仕組みを起動しておく */
function unlockAudio(){
  const ctx = getCtx();
  if(ctx.state === 'suspended') ctx.resume();
  /* 無音を1回鳴らして、確実に解除する */
  try{
    const buf = ctx.createBuffer(1, 1, 22050);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    src.start(0);
  }catch(e){}
}
['touchstart','touchend','click'].forEach(ev=>{
  document.addEventListener(ev, unlockAudio, true);
});
</script>
