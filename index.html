<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>おまつり じゃんけんマン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#e2242c;
    --red-deep:#a3151c;
    --yellow:#ffc93c;
    --gold:#ffe28a;
    --orange:#ff8a3c;
    --dark:#1a1a1a;
    --cream:#fff6e0;
    --green:#2ec4b6;
    --blueacc:#2f6fb3;
    --purple:#7b2cbf;
    --panel-gray:#c6cbcc;
    --panel-gray-dark:#9aa0a2;
  }
  *{box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; touch-action:manipulation;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden;
    font-family:'DotGothic16','Zen Maru Gothic',sans-serif;
  }
  body{
    background:radial-gradient(circle at 50% 0%, #55554f, #29291f 85%);
    color:var(--dark);
  }
  ::-webkit-scrollbar{ display:none; }

  .scanlines{
    position:fixed; inset:0; pointer-events:none; z-index:999;
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,.08) 0 1px, transparent 2px 4px);
    mix-blend-mode:multiply;
  }

  /* ===== 白い筐体 ===== */
  .cabinet{
    position:relative;
    width:100%; height:100dvh;
    display:flex; flex-direction:column;
    padding:min(1.6vw,10px);
    background:linear-gradient(160deg,#fff 0%,#eceae4 55%,#d8d6ce 100%);
    border-radius:20px;
    box-shadow: inset 0 0 0 2px #fff, 0 0 40px rgba(0,0,0,.6);
    overflow:hidden;
  }
  .screen-panel{
    position:relative; flex:1; min-height:0;
    display:flex; flex-direction:column;
    border-radius:12px;
    background:
      radial-gradient(circle at 15% 8%, rgba(255,255,255,.35), transparent 40%),
      linear-gradient(180deg,var(--panel-gray) 0%,var(--panel-gray-dark) 100%);
    border:3px solid #8f9496;
    box-shadow: inset 0 3px 10px rgba(0,0,0,.35);
    overflow:hidden;
  }

  .bg-deco{ position:absolute; opacity:.08; pointer-events:none; font-size:20vw; z-index:0; }
  .bg-deco.torii{ left:-5vw; bottom:-4vw; }
  .bg-deco.fire{ right:-6vw; top:3vw; font-size:15vw; }

  /* ===== 画面切り替え ===== */
  .screen{ display:none; position:absolute; inset:0; z-index:2; }
  .screen.active{ display:flex; }

  /* ===== トップ画面 ===== */
  #top{
    flex-direction:column; align-items:center; justify-content:center;
    padding:12px 16px; gap:min(2.2vh,16px);
  }
  .lantern-row{ display:flex; justify-content:center; gap:4vw; }
  .lantern{ position:relative; width:clamp(18px,3.4vw,28px); }
  .lantern::before{
    content:''; position:absolute; left:50%; top:-7px; width:2px; height:7px;
    background:#8a6a2a; transform:translateX(-50%);
  }
  .lantern .body{
    width:100%; aspect-ratio:1/1.15; border-radius:50%;
    background:radial-gradient(circle at 35% 25%,var(--gold),var(--red) 70%,var(--red-deep));
    border:2px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(8px,1.6vw,12px); color:#5a2a00; font-weight:700;
    box-shadow:0 0 8px rgba(255,201,60,.5);
  }
  .lantern:nth-child(3n){ margin-top:6px; }

  .logo-block{ display:flex; align-items:center; justify-content:center; gap:2vw; }
  .lightning{ font-size:clamp(16px,3.4vw,26px); filter:drop-shadow(1px 1px 0 #a06a00); }
  .logo-badge{
    width:clamp(28px,5.6vw,40px); height:clamp(32px,6.4vw,46px);
    background:linear-gradient(180deg,#ff8a8a,var(--red) 55%,var(--red-deep));
    clip-path:polygon(50% 0%,100% 15%,100% 75%,50% 100%,0% 75%,0% 15%);
    display:flex; align-items:center; justify-content:center;
    color:var(--gold); font-size:clamp(12px,2.6vw,17px); font-weight:700;
    box-shadow:0 2px 4px rgba(0,0,0,.35);
  }
  #top h1{
    margin:0; font-size:clamp(28px,6.4vw,54px); letter-spacing:.05em; font-weight:400;
    color:var(--red); -webkit-text-stroke:2px var(--red-deep); paint-order:stroke fill;
    text-shadow:0 0 3px #fff, 0 0 8px #fff, 3px 3px 4px rgba(0,0,0,.25);
  }
  #top .subtitle{
    margin:0; font-size:clamp(11px,2.2vw,16px); font-weight:700; color:var(--dark);
    background:var(--yellow); padding:3px 14px; border-radius:10px; border:2px solid #c98f00;
  }

  .menu{
    display:flex; gap:min(2vw,14px); width:100%; max-width:900px;
    justify-content:center; flex-wrap:wrap; margin-top:min(1.6vh,10px);
  }
  .menu-btn{
    flex:1 1 200px; max-width:280px; min-height:min(17vh,120px);
    font-family:inherit; cursor:pointer; border-radius:18px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    color:#fff; border:4px solid #fff;
    box-shadow:0 8px 0 rgba(0,0,0,.35);
    padding:10px;
  }
  .menu-btn:active{ transform:translateY(5px); box-shadow:0 3px 0 rgba(0,0,0,.35); }
  .menu-btn .icon{ font-size:clamp(26px,5.4vw,40px); }
  .menu-btn .label{ font-size:clamp(15px,3vw,22px); }
  .menu-btn .sub{ font-size:clamp(10px,1.9vw,13px); opacity:.9; }
  .menu-btn[data-go="study"]{ background:linear-gradient(180deg,#5fd6c9,var(--green)); }
  .menu-btn[data-go="practice"]{ background:linear-gradient(180deg,#ffd977,#e39b00); }
  .menu-btn[data-go="honban"]{ background:linear-gradient(180deg,#ff8a8a,var(--red)); }

  .bgm-btn{
    position:absolute; top:8px; right:10px; z-index:20;
    font-family:inherit; cursor:pointer;
    font-size:clamp(10px,2vw,13px); padding:6px 12px;
    background:rgba(20,20,20,.72); color:#fff; border:2px solid #fff; border-radius:14px;
  }
  .bgm-btn.on{ background:var(--green); border-color:#fff; }
  .bgm-btn:active{ transform:translateY(1px); }

  .taiko-btn{
    position:absolute; top:8px; right:10px; z-index:20;
    width:clamp(32px,5.4vw,42px); height:clamp(32px,5.4vw,42px);
    border-radius:50%; border:2px solid #7a4a10;
    background:radial-gradient(circle at 35% 30%,#ffe9b8,var(--red) 75%);
    font-size:clamp(15px,2.8vw,20px);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 3px 0 rgba(0,0,0,.3); cursor:pointer;
  }
  .taiko-btn:active{ transform:translateY(2px); }

  /* ===== 各モード共通の「もどる」ボタン ===== */
  .back-btn{
    position:absolute; top:8px; left:10px; z-index:20;
    font-family:inherit; cursor:pointer;
    font-size:clamp(10px,2vw,13px); padding:6px 13px;
    background:rgba(20,20,20,.72); color:#fff; border:2px solid #fff; border-radius:14px;
  }
  .back-btn:active{ transform:translateY(1px); }

  /* ===== ① べんきょう ===== */
  #study{ flex-direction:column; align-items:center; justify-content:center; padding:40px 16px 14px; gap:10px; }
  .study-wrap{ width:100%; max-width:760px; display:flex; flex-direction:column; align-items:center; gap:10px; min-height:0; }
  .card{
    width:100%; flex:1; min-height:0; color:var(--dark); border-radius:18px;
    border:4px solid #8f9496; background:#fffdf6;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:16px; position:relative; overflow-y:auto;
    box-shadow:0 6px 0 rgba(0,0,0,.18);
  }
  .card .deco{ font-size:clamp(30px,6.4vw,52px); margin-bottom:8px; }
  .card p{
    font-family:'Zen Maru Gothic',sans-serif;
    font-size:clamp(18px,3.6vw,32px); line-height:1.7; margin:0; font-weight:700;
  }
  .card .pagenum{ position:absolute; top:8px; right:14px; font-size:13px; color:var(--red); }

  .timeline-title{ font-size:clamp(18px,3.4vw,28px); color:var(--red); margin:0 0 10px; font-weight:900; }
  .timeline-list{ display:flex; flex-direction:column; gap:7px; width:100%; }
  .tl-step{ display:flex; align-items:center; gap:10px; text-align:left; background:#f3f0e4; border-radius:12px; padding:6px 10px; }
  .tl-icon{
    flex:0 0 auto; width:clamp(34px,5.4vw,48px); height:clamp(34px,5.4vw,48px);
    border-radius:50%; background:var(--yellow); color:var(--dark);
    display:flex; align-items:center; justify-content:center; font-size:clamp(16px,2.8vw,24px);
    border:2px solid var(--red);
  }
  .tl-text .tl-label{ font-size:clamp(10px,1.8vw,13px); color:var(--red); }
  .tl-text .tl-body{ font-family:'Zen Maru Gothic'; font-weight:700; font-size:clamp(13px,2.4vw,19px); }

  .study-controls{ display:flex; gap:10px; width:100%; max-width:760px; }
  .btn{ font-family:inherit; border:none; cursor:pointer; color:#fff; border-radius:14px; box-shadow:0 5px 0 rgba(0,0,0,.3); }
  .btn:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.3); }
  .nav-btn{ flex:0 0 auto; font-size:clamp(17px,3.2vw,24px); padding:11px 18px; background:#4a4a48; border:2px solid #262624; }
  .speak-btn{ flex:1; font-size:clamp(15px,3vw,21px); padding:13px 10px; background:var(--green); border:2px solid #1a8074; }

  /* ===== ②③ じゃんけん（左右分割の横レイアウト） ===== */
  .janken-screen{ flex-direction:row; align-items:stretch; padding:34px 12px 12px; gap:12px; }
  .janken-left{
    flex:1 1 58%; min-width:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    position:relative;
  }
  .janken-right{
    flex:0 0 clamp(120px,26%,220px);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:min(1.6vh,12px);
  }

  .wheel-wrap{
    position:relative; display:flex; align-items:center; justify-content:center;
    width:min(62vh,52vw); height:min(62vh,52vw);
  }
  .wheel-ring{
    position:absolute; inset:0; border-radius:50%;
    background:conic-gradient(
      var(--red) 0deg 30deg, var(--orange) 30deg 60deg, var(--yellow) 60deg 90deg,
      var(--red) 90deg 120deg, var(--orange) 120deg 150deg, var(--yellow) 150deg 180deg,
      var(--red) 180deg 210deg, var(--orange) 210deg 240deg, var(--yellow) 240deg 270deg,
      var(--red) 270deg 300deg, var(--orange) 300deg 330deg, var(--yellow) 330deg 360deg
    );
    border:4px solid #7a4a10;
    box-shadow:0 0 0 3px #fff, 0 0 26px 6px rgba(255,140,20,.55), 0 4px 10px rgba(0,0,0,.3);
    opacity:.92;
  }
  /* 放射状の光条（後光） */
  .wheel-rays{
    position:absolute; inset:-6%; border-radius:50%; z-index:1;
    background:repeating-conic-gradient(
      rgba(255,255,255,.34) 0deg 6deg, rgba(255,255,255,0) 6deg 18deg
    );
    mix-blend-mode:screen; opacity:.55;
    animation:raysSpin 26s linear infinite;
  }
  @keyframes raysSpin{ to{ transform:rotate(360deg); } }

  /* 抽選盤の外周に並ぶ電球 */
  .bulb-ring{ position:absolute; inset:0; z-index:2; pointer-events:none; }
  .bulb{
    position:absolute; left:50%; top:50%;
    width:clamp(7px,1.5vw,13px); height:clamp(7px,1.5vw,13px); border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fffbe8, #ffd25c 60%, #b57900);
    box-shadow:0 0 7px 2px rgba(255,214,92,.9), 0 1px 2px rgba(0,0,0,.5);
    animation:bulbChase 1.5s linear infinite;
  }
  @keyframes bulbChase{
    0%,72%,100%{ filter:brightness(.55); }
    82%{ filter:brightness(2.1); }
  }

  .big-hand-frame{ position:relative; z-index:3; width:84%; height:84%; }
  .player-hand{
    position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(circle at 50% 42%, #ff5b5b 0%, var(--red-deep) 55%, #3d0003 100%);
    border:4px solid #ffdede;
    display:flex; align-items:center; justify-content:center;
    font-size:min(32vh,26vw); line-height:1;
    box-shadow:0 0 30px 8px rgba(226,36,44,.8), inset 0 0 22px rgba(0,0,0,.6);
    filter:drop-shadow(0 0 6px #fff);
  }

  /* 待機中のアイドル演出 */
  .wheel-ring{ animation:wheelIdle 30s linear infinite; }
  @keyframes wheelIdle{ to{ transform:rotate(360deg); } }
  .lantern{ animation:lanternSway 3.4s ease-in-out infinite; transform-origin:top center; }
  .lantern:nth-child(2n){ animation-delay:.5s; }
  .lantern:nth-child(3n){ animation-delay:1.1s; }
  @keyframes lanternSway{
    0%,100%{ transform:rotate(-3.5deg); }
    50%{ transform:rotate(3.5deg); }
  }

  .dot-ring-dot{
    position:absolute; width:clamp(4px,1vw,8px); height:clamp(4px,1vw,8px);
    left:50%; top:50%; border-radius:50%;
    background:#fff; box-shadow:0 0 7px 2px #fff;
    animation:dotChase 1.2s linear infinite; opacity:.2;
  }
  @keyframes dotChase{ 0%,85%,100%{opacity:.15;} 92%{opacity:1;} }
  .land-flash{ animation:landFlashy .45s ease-out 1; }
  @keyframes landFlashy{
    0%{ filter:drop-shadow(0 0 30px #fff) brightness(2.4); transform:scale(1.14); }
    100%{ filter:drop-shadow(0 0 6px #fff) brightness(1); transform:scale(1); }
  }

  .roulette-box{
    font-family:'DotGothic16'; background:#0a0a0a; color:var(--red);
    border:3px solid #7a4a10; border-radius:8px; padding:3px 12px;
    font-size:clamp(15px,2.6vw,22px); letter-spacing:.2em;
    text-shadow:0 0 8px var(--red);
    box-shadow:inset 0 0 10px rgba(226,36,44,.6);
    display:none; position:relative; z-index:4;
  }
  .roulette-box.active{ display:inline-block; }

  .start-hint{
    font-size:clamp(16px,3vw,26px); font-weight:900; color:var(--red); text-align:center;
    animation:hintPulse 1.1s infinite;
  }
  @keyframes hintPulse{ 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.55; transform:scale(1.05);} }

  .result-banner{
    font-size:clamp(15px,2.8vw,26px); text-align:center; color:var(--red); font-weight:700;
    line-height:1.35; min-height:1.4em; width:100%;
  }
  .result-banner.stamp{
    background:#fff; border:5px solid var(--red); border-radius:14px;
    padding:9px 10px; transform:rotate(-4deg); width:100%;
    box-shadow:0 6px 0 rgba(0,0,0,.22), 0 0 16px rgba(226,36,44,.4);
    animation:stampIn .32s cubic-bezier(.34,1.56,.64,1);
    /* 常に1行に収める */
    white-space:nowrap; overflow:hidden;
    font-size:clamp(11px,1.9vw,20px);
    letter-spacing:.02em;
  }
  @keyframes stampIn{
    0%{ transform:rotate(-4deg) scale(.3); opacity:0; }
    100%{ transform:rotate(-4deg) scale(1); opacity:1; }
  }

  /* 操作パネル（右側に縦並び） */
  .control-panel{
    width:100%; background:#2a2a28; border-radius:16px; padding:min(1.6vh,12px) 8px;
    border-top:7px solid;
    border-image:repeating-linear-gradient(45deg,#e2242c 0 10px,#fff 10px 20px) 7;
  }
  .hand-buttons{ display:flex; flex-direction:column; align-items:center; gap:min(1.6vh,12px); }
  .btn-wrap{ display:flex; align-items:center; gap:8px; }
  .indicator-dot{
    width:clamp(7px,1.4vw,11px); height:clamp(7px,1.4vw,11px); border-radius:50%;
    box-shadow:0 0 5px 1px currentColor; opacity:.85; flex:0 0 auto;
  }
  .hand-buttons button{
    font-family:inherit;
    width:min(15vh,80px); height:min(15vh,80px); border-radius:50%;
    font-size:min(8vh,42px); color:#fff; cursor:pointer; border:5px solid #111;
    box-shadow:0 7px 0 #0a0a0a, inset 0 -6px 10px rgba(0,0,0,.3), inset 0 4px 7px rgba(255,255,255,.5);
  }
  .hand-buttons button[data-hand="rock"]{ background:radial-gradient(circle at 35% 25%,#ff9c9c,var(--red) 62%,var(--red-deep)); }
  .hand-buttons button[data-hand="scissors"]{ background:radial-gradient(circle at 35% 25%,#fff2ae,var(--yellow) 62%,#c98f00); }
  .hand-buttons button[data-hand="paper"]{ background:radial-gradient(circle at 35% 25%,#a9dcff,var(--blueacc) 62%,#1d3557); }
  .hand-buttons button:active{
    transform:translateY(5px);
    box-shadow:0 2px 0 #0a0a0a, inset 0 -4px 8px rgba(0,0,0,.3), inset 0 3px 6px rgba(255,255,255,.35);
  }
  .hand-buttons button.picked{
    animation:pickedPulse 1.6s ease-out forwards;
    outline:5px solid #fff; outline-offset:3px; z-index:5;
  }
  @keyframes pickedPulse{
    0%{ transform:scale(1.26); box-shadow:0 0 40px 18px rgba(255,255,255,.9); filter:brightness(2.2); }
    100%{ transform:scale(1.1); box-shadow:0 7px 0 #0a0a0a, 0 0 22px 8px rgba(255,255,255,.55); filter:brightness(1.25); }
  }
  .hand-buttons button.dimmed{ opacity:.3; filter:grayscale(.6); transition:opacity .2s,filter .2s; }

  .care-msg{
    width:100%; background:#fffdf6; color:var(--red);
    border-radius:14px; border:3px solid #8f9496; display:none;
    align-items:center; justify-content:center; text-align:center;
    font-size:clamp(13px,2.4vw,20px); font-weight:700; padding:9px 10px; line-height:1.4;
    box-shadow:0 4px 0 rgba(0,0,0,.2); font-family:'Zen Maru Gothic';
  }
  .care-msg.show{ display:flex; }

  .reset-btn{
    font-size:clamp(12px,2.2vw,17px); padding:10px 16px; background:var(--purple);
    border:2px solid #4a1a80; display:none; width:100%;
  }
  .reset-btn.show{ display:block; }

  /* キラキラ演出 */
  .sparkle-overlay{ position:absolute; inset:0; pointer-events:none; z-index:6; opacity:0; transition:opacity .25s; }
  .sparkle-overlay.active{ opacity:1; }
  .sparkle{
    position:absolute; border-radius:50%; background:#fff;
    box-shadow:0 0 10px 4px #fff, 0 0 18px 7px var(--gold);
    animation:twinkle .85s infinite ease-in-out;
  }
  @keyframes twinkle{ 0%,100%{opacity:.18; transform:scale(.5);} 50%{opacity:1; transform:scale(1.3);} }

  /* 画面全体のフラッシュ */
  .flash-overlay{
    position:absolute; inset:0; pointer-events:none; z-index:900;
    opacity:0;
  }
  .flash-overlay.win{ animation:flashWin .7s ease-out; }
  .flash-overlay.lose{ animation:flashLose .7s ease-out; }
  @keyframes flashWin{
    0%{ opacity:0; background:radial-gradient(circle,#fff8d0,#ffbe2e); }
    18%{ opacity:.9; background:radial-gradient(circle,#fff8d0,#ffbe2e); }
    100%{ opacity:0; background:radial-gradient(circle,#fff8d0,#ffbe2e); }
  }
  @keyframes flashLose{
    0%{ opacity:0; background:radial-gradient(circle,#e8fbff,#5ec8f0); }
    18%{ opacity:.85; background:radial-gradient(circle,#e8fbff,#5ec8f0); }
    100%{ opacity:0; background:radial-gradient(circle,#e8fbff,#5ec8f0); }
  }

  /* 勝ち：手のまわりに広がる光の輪 */
  .halo{
    position:absolute; left:50%; top:50%; z-index:7;
    width:30%; height:30%; margin:-15% 0 0 -15%;
    border-radius:50%; border:6px solid var(--gold);
    pointer-events:none; opacity:0;
  }
  .halo.go{ animation:haloOut .95s ease-out; }
  @keyframes haloOut{
    0%{ transform:scale(.5); opacity:1; }
    100%{ transform:scale(4.2); opacity:0; }
  }

  /* 負け：下から舞い上がる応援シンボル */
  .rise{
    position:fixed; bottom:-50px; z-index:1000; pointer-events:none;
    animation:riseUp linear forwards;
  }
  @keyframes riseUp{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(-105vh) rotate(200deg); opacity:.1; }
  }

  /* 勝ちスタンプはバウンドしながら登場 */
  .result-banner.stamp.win-stamp{ animation:stampBounce .6s cubic-bezier(.28,1.6,.5,1); }
  @keyframes stampBounce{
    0%{ transform:rotate(-4deg) scale(.2); opacity:0; }
    55%{ transform:rotate(-4deg) scale(1.22); opacity:1; }
    75%{ transform:rotate(-4deg) scale(.94); }
    100%{ transform:rotate(-4deg) scale(1); }
  }
  /* 負けスタンプは力強く登場 */
  .result-banner.stamp.lose-stamp{
    border-color:var(--blueacc); color:var(--blueacc);
    animation:stampPush .5s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes stampPush{
    0%{ transform:rotate(3deg) scale(1.7); opacity:0; }
    60%{ transform:rotate(3deg) scale(.95); opacity:1; }

<script>
/* ===== 音声読み上げ ===== */
let jaVoice = null;
function pickVoice(){
  const v = speechSynthesis.getVoices();
  jaVoice = v.find(x=>x.lang==='ja-JP') || v.find(x=>x.lang && x.lang.startsWith('ja')) || null;
}
if ('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, opt){
  if (!('speechSynthesis' in window)) return;
  if (window.bgm) bgm.duck(1600);
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang='ja-JP'; if (jaVoice) u.voice=jaVoice;
  u.rate = (opt && opt.rate) || 1.15;   /* すこし速く、弾んだ感じに */
  u.pitch = (opt && opt.pitch) || 1.9;  /* 高めの声で元気いっぱいに */
  u.volume = 1;
  speechSynthesis.speak(u);
}
/* 掛け声など、複数のことばを続けて元気よく言う */
function speakSeq(parts){
  if (!('speechSynthesis' in window)) return;
  if (window.bgm) bgm.duck(1800);
  speechSynthesis.cancel();
  parts.forEach(p=>{
    const u = new SpeechSynthesisUtterance(p.text);
    u.lang='ja-JP'; if (jaVoice) u.voice=jaVoice;
    u.rate = p.rate || 1.2;
    u.pitch = p.pitch || 2.0;
    u.volume = 1;
    speechSynthesis.speak(u);
  });
}

/* ===== 8bit効果音 ===== */
let actx=null;
function getCtx(){
  if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
  if(actx.state==='suspended') actx.resume();
  return actx;
}
function beep(freq,start,dur,type='square',g=0.18){
  const ctx=getCtx(), osc=ctx.createOscillator(), gain=ctx.createGain();
  osc.type=type;
  osc.frequency.setValueAtTime(freq, ctx.currentTime+start);
  gain.gain.setValueAtTime(0, ctx.currentTime+start);
  gain.gain.linearRampToValueAtTime(g, ctx.currentTime+start+0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+start+dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(ctx.currentTime+start); osc.stop(ctx.currentTime+start+dur+0.02);
}
function playWin(){ [523,659,784,1047].forEach((f,i)=>beep(f,i*0.13,0.18,'square',0.2)); }
function playDraw(){ beep(500,0,0.12,'triangle',0.16); beep(500,0.16,0.12,'triangle',0.16); }
function playCelebrate(){
  [523,659,784,1047,1319].forEach((f,i)=>beep(f,i*0.09,0.2,'square',0.18));
  beep(2093,0.55,0.35,'sine',0.1);
}
function playPon(){ beep(1568,0,0.16,'square',0.25); beep(2093,0.02,0.22,'sine',0.15); }
/* 負けたときも前向きになる、行進曲風の応援メロディ */
function playCheer(){
  [[784,0],[784,0.16],[880,0.32],[1047,0.48],[880,0.68],[1047,0.84],[1319,1.0]]
    .forEach(([f,t])=>beep(f,t,0.2,'square',0.19));
  beep(1568,1.2,0.4,'sine',0.12);
}
function trillTick(){ beep(Math.random()<0.5?740:950, 0, 0.045, 'sine', 0.13); }
function playTaiko(){
  const ctx=getCtx();
  [0,0.18,0.36].forEach(t=>{
    const osc=ctx.createOscillator(), gain=ctx.createGain();
    osc.type='sine';
    osc.frequency.setValueAtTime(90, ctx.currentTime+t);
    osc.frequency.exponentialRampToValueAtTime(45, ctx.currentTime+t+0.15);
    gain.gain.setValueAtTime(0.35, ctx.currentTime+t);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+t+0.2);
    osc.connect(gain).connect(ctx.destination);
    osc.start(ctx.currentTime+t); osc.stop(ctx.currentTime+t+0.22);
  });
}

/* ===== お祭りBGM（祭囃子風の8bitループ・コード内で生成） ===== */
window.bgm = (function(){
  let on = false;          /* ボタンでのオン・オフ */
  let playing = false;     /* いま鳴らしているか */
  let timer = null;
  let step = 0;
  let master = null;
  const STEP_MS = 200;     /* 1ステップの長さ */

  /* 篠笛のかわりの8bitメロディ（和の陽音階・0は休み） */
  const melody = [
    784,  0, 880, 988, 1047, 0, 988, 880,
    784,  0, 659, 784,  880,  0, 784,   0,
    1047, 0, 988, 880,  784,  0, 659, 784,
    880,  0, 784, 659,  587,  0,   0,   0
  ];
  /* 太鼓のリズム（2=ドン、1=ドコ、0=休み） */
  const drum = [
    2,0,1,1, 2,0,1,0, 2,0,1,1, 2,1,0,1,
    2,0,1,1, 2,0,1,0, 2,0,1,1, 2,1,1,0
  ];

  function ensureMaster(){
    const ctx = getCtx();
    if(!master){
      master = ctx.createGain();
      master.gain.value = 0.22;
      master.connect(ctx.destination);
    }
    return ctx;
  }
  function note(freq, dur, type, g){
    const ctx = ensureMaster();
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(g, ctx.currentTime + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.connect(gain).connect(master);
    osc.start(); osc.stop(ctx.currentTime + dur + 0.02);
  }
  function taikoHit(strong){
    const ctx = ensureMaster();
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = 'sine';
    const f0 = strong ? 110 : 150;
    osc.frequency.setValueAtTime(f0, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(f0*0.45, ctx.currentTime + 0.13);
    gain.gain.setValueAtTime(strong ? 0.5 : 0.28, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
    osc.connect(gain).connect(master);
    osc.start(); osc.stop(ctx.currentTime + 0.2);
  }
  function tick(){
    const i = step % melody.length;
    const f = melody[i];
    if(f) note(f, 0.19, 'square', 0.14);
    /* 5度上を薄く重ねて、笛らしい厚みを出す */
    if(f && i % 4 === 0) note(f*1.5, 0.16, 'triangle', 0.05);
    const d = drum[i];
    if(d) taikoHit(d === 2);
    step++;
  }
  function startLoop(){
    if(playing) return;
    ensureMaster();
    playing = true;
    tick();
    timer = setInterval(tick, STEP_MS);
  }
  function stopLoop(){
    playing = false;
    clearInterval(timer);
    timer = null;
  }
  return {
    isOn: ()=> on,
    toggle(){
      on = !on;
      if(!on) stopLoop();
      return on;
    },
    /* じゃんけん画面に入ったとき／出たとき */
    enter(){ if(on) startLoop(); },
    leave(){ stopLoop(); },
    /* 掛け声や結果の音声が聞こえるよう、一時的に音量を下げる */
    duck(ms){
      if(!master) return;
      const ctx = getCtx();
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setValueAtTime(0.05, ctx.currentTime);
      master.gain.linearRampToValueAtTime(0.22, ctx.currentTime + (ms||1400)/1000);
    }
  };
})();
const bgm = window.bgm;

/* ===== ① べんきょう ===== */
const studyPages = [

  { type:'card', deco:'⛩️', text:'じゅうにそう くまのじんじゃは、むかしむかし すずき くろうさんが きしゅう くまのの かみさまを おむかえした じんじゃだよ' },
  { type:'card', deco:'🎏', text:'まいとし 9がつに 「れいたいさい」という おおきな おまつりが あるよ。おみこしが まちを ねりあるくんだ' },
  { type:'card', deco:'👘', text:'ここの おみこしは 「ちどりかつぎ」という とくべつな かつぎかたを するんだって！' },
  { type:'card', deco:'🎐', text:'まちの おともだちが おみこしを かついで まちを あるくよ' },
  { type:'card', deco:'😊', text:'がんばった おともだちが この がっこうに やすみに くるよ！' },
  { type:'timeline', title:'とうじつの ながれ', steps:[
      { icon:'🌅', label:'あさ', text:'おみこし しゅっぱつ！' },

let studyIndex=0;
const studyCardInner=document.getElementById('studyCardInner');

function studySpoken(p){
  if(p.type==='timeline') return p.title+'。'+p.steps.map(s=>s.label+'、'+s.text).join('。');
  return p.text;
}
function renderStudy(){

    let html='<h3 class="timeline-title">'+p.title+'</h3><div class="timeline-list">';

            '<div class="tl-body">'+s.text+'</div></div></div>';
    });
    studyCardInner.innerHTML=html+'</div>';
  } else {
    studyCardInner.innerHTML='<div class="deco">'+p.deco+'</div><p>'+p.text+'</p>';
  }
}

/* ===== ②③ じゃんけん ===== */
const HANDS=['rock','scissors','paper'];
const winMap={rock:'scissors',scissors:'paper',paper:'rock'};
function judge(mine,theirs){
  if(mine===theirs) return 'draw';
  return winMap[mine]===theirs ? 'win' : 'lose';
}

function createJankenController(opts){
  const stageEl=document.getElementById(opts.stageId);
  const screenEl=stageEl.closest('.screen');
  const els={
    playerHand:document.getElementById(opts.playerHandId),
    result:document.getElementById(opts.resultId),
    stepStart:document.getElementById(opts.stepStartId),
    choiceButtons:stageEl.querySelectorAll('.hand-buttons button'),
    careMsg:document.getElementById(opts.careMsgId),
    resetBtn:document.getElementById(opts.resetBtnId),
    roulette:document.getElementById(opts.rouletteId)
  };
  let phase='idle';
  let currentHand='rock';
  let handCycleTimer=null, trillTimer=null;

  function rouletteTick(){
    if(!els.roulette) return;
    const n=()=>Math.floor(Math.random()*10);
    els.roulette.textContent=n()+' '+n()+' '+n();
  }
  function startHandCycle(){
    let i=0, elapsed=0;
    function delay(e){ return e<400?210 : e<800?120 : 60; }
    function tick(){
      currentHand=HANDS[i%3];
      setHand(els.playerHand, currentHand);
      rouletteTick();
      i++;
      const d=delay(elapsed); elapsed+=d;
      handCycleTimer=setTimeout(tick,d);
    }
    tick();
  }

  function reset(){
    phase='idle'; currentHand='rock';
    clearTimeout(handCycleTimer); clearInterval(trillTimer);
    sparkleOff();
    if(els.roulette) els.roulette.classList.remove('active');
    setHand(els.playerHand, null);
    els.playerHand.classList.remove('land-flash');
    els.choiceButtons.forEach(b=>b.classList.remove('picked','dimmed'));
    els.result.textContent='';
    els.result.classList.remove('stamp','win-stamp','lose-stamp');
    els.careMsg.classList.remove('show');
    els.careMsg.textContent='';
    els.resetBtn.classList.remove('show');
    els.stepStart.style.display='block';
    speechSynthesis.cancel();
  }

  function startRound(){
    if(phase!=='idle') return;
    phase='running';
    els.stepStart.style.display='none';
    els.careMsg.classList.remove('show');
    els.resetBtn.classList.remove('show');
    els.choiceButtons.forEach(b=>b.classList.remove('picked','dimmed'));
    els.result.textContent='';
    els.result.classList.remove('stamp','win-stamp','lose-stamp');
    speakSeq([{text:'ジャン'},{text:'ケン！', rate:1.05, pitch:2.0}]);
    sparkleOn();
    if(els.roulette) els.roulette.classList.add('active');
    trillTimer=setInterval(trillTick,90);
    startHandCycle();
  }

  function onPick(hand){
    if(phase!=='running') return;
    phase='result';
    clearTimeout(handCycleTimer); clearInterval(trillTimer);
    rouletteTick();
    setTimeout(()=>{ if(els.roulette) els.roulette.classList.remove('active'); },900);
    sparkleOff();

    const mine=currentHand;
    setHand(els.playerHand, mine);
    els.playerHand.classList.add('land-flash');
    els.choiceButtons.forEach(b=>{
      b.classList.add(b.dataset.hand===hand ? 'picked' : 'dimmed');
    });
    playPon();
    setTimeout(()=>els.playerHand.classList.remove('land-flash'),480);

    const result=judge(mine,hand);

    if(result==='draw'){
      els.result.textContent='あいこで';
      speak('あいこで', {rate:1.1, pitch:2.0});
      playDraw();
      setTimeout(()=>{
        els.choiceButtons.forEach(b=>b.classList.remove('picked','dimmed'));
        phase='idle';
        startRound();
      },1200);
      return;
    }

    /* 表示は「あそびに きた こ」から見た結果。負けても前向きな応援にする */
    if(result==='lose'){
      /* 相手の子の勝ち：金色フラッシュ＋光の輪＋盛大な紙吹雪 */
      els.result.textContent='🎉 きみの かち！';
      els.result.classList.add('stamp','win-stamp');
      screenFlash('win');
      haloBurst(opts.haloId);
      confettiBurst();
      speakSeq([{text:'ヤッター！'},{text:'きみの かち！'}]);
      playWin();
      playCelebrate();
    } else {
      /* 相手の子が負けでも、応援シンボルが舞い上がる華やかな演出にする */
      els.result.textContent='⛩️ おみこし ファイト！';
      els.result.classList.add('stamp','lose-stamp');
      screenFlash('lose');
      riseBurst();
      speakSeq([{text:'おみこし'},{text:'ファイト！'}]);
      playCheer();
    }

    setTimeout(()=>{
      const msg=opts.messages[Math.floor(Math.random()*opts.messages.length)];
      els.careMsg.textContent=msg;
      els.careMsg.classList.add('show');
      speak(msg, {rate:1.0, pitch:1.7});
      els.resetBtn.classList.add('show');
    },900);
  }

  screenEl.addEventListener('click',(e)=>{
    if(phase!=='idle') return;
    if(e.target.closest('.back-btn') || e.target.closest('.bgm-btn') || e.target.closest('.hand-buttons') || e.target.closest('.reset-btn')) return;
    startRound();
  });
  els.choiceButtons.forEach(b=>{
    b.addEventListener('click',(e)=>{ e.stopPropagation(); onPick(b.dataset.hand); });
  });
  els.resetBtn.addEventListener('click',(e)=>{ e.stopPropagation(); reset(); });

  reset();
  return { reset };
}
